  <path d="M64 44 A 20 20 0 0 1 84 64 A 20 20 0 0 1 64 84 A 20 20 0 0 1 44 64 A 20 20 0 0 1 64 44 Z" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  
